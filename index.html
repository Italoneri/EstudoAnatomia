<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumi · Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0420; --bg2:#12072a; --panel:#1f1748; --panel2:#2a2058;
  --card:#2a0a42; --line:#2b2250; --text:#fff; --muted:#b8a9d8;
  --lav:#d3a6f0; --lav2:#e6c8fa; --blue:#1b8fe0; --green:#4cd964; --red:#ff3b3b; --pink:#ff6f8a;
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--lav)}
svg{display:block}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- topo ---------- */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;font-size:46px;font-weight:600;letter-spacing:-1px;cursor:pointer;user-select:none}
.logo svg{width:44px;height:44px}
.top-actions{display:flex;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;background:#ece6f6;color:#1d1240;font-size:19px;font-weight:500;transition:.15s}
.pill:hover{background:#fff}
.pill .ico{width:20px;height:20px}
.avatar{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#8fd3ff,#5b6be0 60%,#2b1a6b);border:3px solid var(--lav);position:relative;display:grid;place-items:center;font-weight:800;font-size:20px}
.avatar .crown{position:absolute;top:-12px;right:-6px;background:#ffd23f;color:#1d1240;font-size:12px;font-weight:800;padding:1px 6px;border-radius:8px}

/* ---------- home ---------- */
.home{padding:20px 24px 40px}
.create{display:flex;align-items:center;gap:14px;width:400px;max-width:100%;padding:22px 20px;border:2px solid var(--lav2);border-radius:10px;font-size:20px;margin-bottom:20px;transition:.15s}
.create:hover{background:#1a0f3a}
.create .ico{width:34px;height:34px}
.create .arrow{margin-left:auto;width:22px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:14px;width:400px;max-width:100%;padding:14px 20px;border:2px solid var(--lav2);border-radius:999px}
.search input{background:none;border:0;outline:0;font-size:19px;width:100%}
.search input::placeholder{color:#8e7fb5}
.filter{display:flex;align-items:center;gap:8px;background:#221a4f;padding:10px 16px;border-radius:10px;font-size:19px;position:relative}
.filter select{background:transparent;border:0;outline:0;font-size:19px;appearance:none;padding-right:22px;cursor:pointer}
.filter select option{background:#221a4f}
.filter .chev{position:absolute;right:12px;pointer-events:none;width:16px}
.subject{margin-top:28px}
.subject-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.subject-head h2{font-size:30px;font-weight:600}
.subject-head button .ico{width:26px;height:26px}
.subject-head button{opacity:.95}
.subject-head button:hover{opacity:1;color:var(--lav)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.kit{position:relative;min-height:220px;border-radius:var(--radius);padding:26px 28px;background:var(--card);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;display:flex;flex-direction:column}
.kit:hover{transform:translateY(-3px);box-shadow:0 10px 30px #0008}
.kit h3{font-size:21px;font-weight:700;line-height:1.3;padding-right:34px;color:var(--title,#fff)}
.kit .deco{position:absolute;right:14px;bottom:8px;width:110px;height:110px;opacity:.55;fill:var(--deco,#5a2a9a)}
.kit .menu{position:absolute;top:24px;right:18px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.kit .menu:hover{background:#ffffff22}
.kit .bar{margin-top:auto;position:relative;z-index:1;width:88%;height:16px;border-radius:999px;background:var(--track,#120320);overflow:hidden}
.kit .bar i{display:block;height:100%;border-radius:999px;background:var(--fill,#6a22c9);min-width:12%}
.kit .count{position:relative;z-index:1;font-size:14px;opacity:.85;margin:8px 0 10px}
.dropdown{position:absolute;top:56px;right:16px;background:#1d1445;border:1px solid var(--line);border-radius:12px;padding:6px;z-index:5;min-width:190px;box-shadow:0 10px 30px #000a}
.dropdown button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-size:15px;color:#fff}
.dropdown button:hover{background:#2c2160}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* ---------- página do kit ---------- */
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 87px)}
.layout.collapsed{grid-template-columns:70px 1fr}
aside{border-right:1px solid var(--line);padding:20px 0;position:relative;display:flex;flex-direction:column}
.nav{display:flex;align-items:center;gap:12px;padding:13px 20px;font-size:20px;border-left:3px solid transparent;white-space:nowrap;width:100%}
.nav .ico{width:30px;height:30px;flex:none}
.nav:hover{background:#ffffff08}
.nav.active{color:var(--lav);border-left-color:var(--lav)}
.collapsed .nav span{display:none}
.collapse-btn{margin-top:auto;align-self:flex-end;margin-right:24px;padding:8px}
.collapsed .collapse-btn{transform:scaleX(-1);margin-right:18px}
main{padding:22px 20px 0;display:flex;flex-direction:column;min-width:0}
.content{flex:1}
footer{border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;font-size:16px;color:#e8e2f5;margin-top:40px;flex-wrap:wrap}
footer .links{display:flex;gap:26px;margin:auto}
footer .links .ico{width:22px;height:22px}

.kit-head{display:flex;gap:30px;align-items:flex-start;padding-left:16px}
.kit-head .big-ico{width:70px;height:80px;flex:none}
.kit-head h1{font-size:30px;font-weight:700;display:flex;align-items:center;gap:20px;margin-top:8px}
.kit-head h1 button .ico{width:26px;height:26px}
.select-subject{margin-top:14px;width:480px;max-width:100%;display:flex;align-items:center;gap:10px;border:1px solid #3a3070;border-radius:6px;padding:10px 14px;font-size:18px;position:relative}
.select-subject select{background:transparent;border:0;outline:0;font-size:18px;width:100%;appearance:none;cursor:pointer}
.select-subject select option{background:#1d1445}
.dot{width:16px;height:12px;border-radius:2px;flex:none}
.lang{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:20px}
.btn-lav{display:inline-flex;align-items:center;gap:8px;background:var(--lav);color:#1d1240;padding:12px 18px;border-radius:14px;font-size:20px;font-weight:500;transition:.15s}
.btn-lav:hover{background:var(--lav2)}
.btn-lav .ico{width:22px;height:22px}
.tabs{display:flex;border-bottom:1px solid #3a3070;margin-top:18px}
.tab{padding:14px 64px;font-size:24px;color:#e2dcf3;border-bottom:2px solid transparent;display:flex;align-items:center;gap:10px}
.tab.active{border-bottom-color:var(--lav)}
.tab .badge{background:#ff7a1a;color:#fff;font-size:13px;font-weight:700;padding:5px 7px;border-radius:12px}
.btn-outline{display:inline-flex;align-items:center;gap:6px;border:1px solid #cfc6e6;border-radius:999px;padding:9px 16px;font-size:20px;margin:14px 6px}
.file{display:flex;align-items:center;gap:14px;background:#251c55;border-radius:6px;padding:10px 14px;width:625px;max-width:100%;margin:10px 0;font-size:20px;position:relative}
.file .ico{width:30px;height:30px}
.file .rm{position:absolute;right:10px;top:8px;width:24px;height:24px}
textarea.notes{width:100%;min-height:300px;background:#1a1240;border:1px solid #3a3070;border-radius:12px;padding:16px;font-size:17px;outline:0;margin-top:16px;resize:vertical}

/* ---------- estudo inteligente ---------- */
.level{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 0 22px;border-bottom:1px solid var(--line)}
.lvl-track{position:relative;width:min(736px,60vw);height:34px;background:var(--lav);border-radius:8px;overflow:hidden}
.lvl-track i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#0d7fd6,#2aa4f4);border-radius:8px;transition:width .5s}
.lvl-track span{position:absolute;top:50%;transform:translateY(-50%);color:#1d1240;font-size:19px;font-weight:500;white-space:nowrap;transition:left .5s}
.star{width:36px;height:36px}
.gear{margin-left:40px}
.gear .ico{width:38px;height:38px}
.study{max-width:1480px;margin:0 auto;padding:40px 60px}
.question{font-size:26px;font-weight:700;margin-bottom:22px;line-height:1.35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.opt{display:flex;align-items:center;gap:16px;background:var(--panel);border:2px solid transparent;border-radius:14px;padding:18px 10px;font-size:20px;text-align:left;transition:.12s}
.opt:hover:not(:disabled){background:var(--panel2)}
.opt:disabled{cursor:default}
.opt .num{width:46px;height:46px;flex:none;border-radius:50%;background:var(--lav);color:#2a1660;display:grid;place-items:center;font-size:19px}
.opt.correct{border-color:var(--green);box-shadow:0 0 10px #4cd96455}
.opt.correct .num{background:var(--green);color:#0c3a14}
.opt.wrong{border-color:var(--red);box-shadow:0 0 10px #ff3b3b55}
.opt.wrong .num{background:var(--red);color:#fff}
.opt .num .ico{width:26px;height:26px;stroke-width:3}
.study-row{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.btn-light{background:#ece6f6;color:#1d1240;padding:12px 18px;border-radius:999px;font-size:20px}
.btn-light:hover{background:#fff}
.thumbs{display:flex;gap:8px}
.thumbs button{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;transition:.15s}
.thumbs .up{background:var(--green)}
.thumbs .down{background:#ff6b6b}
.thumbs button.on{outline:3px solid #fff}
.thumbs .ico{width:24px;height:24px;fill:#fff;stroke:none}
.center{text-align:center;margin-top:30px}
.btn-pill-lav{background:var(--lav);color:#1d1240;padding:12px 16px;border-radius:999px;font-size:20px}
.btn-pill-lav:hover{background:var(--lav2)}
.explain{display:flex;gap:28px;margin-top:40px;align-items:flex-start;animation:fade .3s}
.explain ul{flex:1;padding-left:96px;display:flex;flex-direction:column;gap:22px}
.explain li{font-size:20px;line-height:1.55;color:#f0ecfa}
.explain img{width:360px;max-width:40%;border-radius:4px;background:#fff}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- flashcards ---------- */
.fc-wrap{display:flex;flex-direction:column;align-items:center;padding:40px 20px}
.fc-count{color:var(--muted);font-size:18px;margin-bottom:16px}
.fc{width:min(760px,90%);height:360px;perspective:1400px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;font-size:26px;line-height:1.45;background:var(--panel);border:2px solid #3a3070}
.fc-face small{position:absolute;top:18px;left:24px;font-size:14px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.fc-back{transform:rotateY(180deg);background:#2b1a5e;border-color:var(--lav);font-size:22px}
.fc-actions{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;justify-content:center}

/* ---------- guia ---------- */
.guide{max-width:900px;margin:0 auto;padding:30px 20px;font-size:19px;line-height:1.7}
.guide h2{font-size:28px;margin:26px 0 10px;color:var(--lav)}
.guide h3{font-size:22px;margin:20px 0 8px}
.guide ul,.guide ol{padding-left:28px;margin:8px 0}
.guide p{margin:8px 0}
.guide table{border-collapse:collapse;margin:14px 0;width:100%}
.guide th,.guide td{border:1px solid #3a3070;padding:8px 12px;text-align:left}
.guide th{background:#221a4f}
.guide .box{background:#221a4f;border-left:4px solid var(--lav);padding:12px 16px;border-radius:8px;margin:14px 0}

/* ---------- prova ---------- */
.exam{max-width:1100px;margin:0 auto;padding:30px 20px}
.exam-setup{text-align:center;padding:40px 0}
.exam-setup h2{font-size:30px;margin-bottom:10px}
.exam-setup p{color:var(--muted);font-size:18px;margin-bottom:24px}
.exam-setup .choices{display:flex;gap:12px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
.chip{padding:10px 20px;border-radius:999px;border:2px solid #3a3070;font-size:18px}
.chip.on{border-color:var(--lav);background:#2b1a5e}
.exam-progress{height:8px;background:#221a4f;border-radius:99px;margin-bottom:26px;overflow:hidden}
.exam-progress i{display:block;height:100%;background:var(--lav);transition:width .3s}
.score{text-align:center;padding:30px 0}
.score .big{font-size:72px;font-weight:800;color:var(--lav)}
.review{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.review div{background:var(--panel);border-radius:12px;padding:14px 18px;border-left:5px solid var(--green);font-size:17px;line-height:1.5}
.review div.bad{border-left-color:var(--red)}
.review small{color:var(--muted)}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:#05011099;display:grid;place-items:center;z-index:50;animation:fade .2s}
.modal{background:#1a1140;border:1px solid #3a3070;border-radius:20px;padding:28px;width:min(620px,92vw);max-height:86vh;overflow:auto}
.modal h3{font-size:24px;margin-bottom:14px}
.modal p{color:var(--muted);line-height:1.5;margin-bottom:12px}
.modal input[type=text],.modal textarea{width:100%;background:#0f0828;border:1px solid #3a3070;border-radius:10px;padding:12px;font-size:17px;outline:0}
.modal textarea{min-height:220px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.modal .row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:14px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist div{display:flex;gap:10px;align-items:flex-start;background:#221a4f;padding:10px 12px;border-radius:10px;font-size:15px;line-height:1.4}
.hist b{flex:none}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatches button{width:46px;height:46px;border-radius:12px;border:3px solid transparent}
.swatches button.on{border-color:#fff}
.switch{width:52px;height:30px;border-radius:99px;background:#3a3070;position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--lav)}
.switch.on::after{left:26px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#ece6f6;color:#1d1240;padding:12px 22px;border-radius:999px;font-size:16px;z-index:60;animation:fade .2s}
.kbd{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
.bloco-filter{display:inline-flex;align-items:center;gap:8px;background:#221a4f;padding:8px 14px;border-radius:10px;font-size:16px;position:relative;margin-bottom:22px;max-width:100%}
.bloco-filter select{background:transparent;border:0;outline:0;font-size:16px;appearance:none;padding-right:24px;cursor:pointer;max-width:70vw}
.bloco-filter select option{background:#221a4f}
.bloco-filter .chev{position:absolute;right:10px;pointer-events:none;width:16px}
.meta{display:flex;flex-wrap:wrap;gap:8px;padding-left:96px;margin-top:22px}
.meta span{background:#221a4f;color:var(--muted);font-size:14px;padding:5px 12px;border-radius:999px}
.meta .warn{background:#5a3a10;color:#ffd08a}
@media (max-width:900px){.meta{padding-left:20px}}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0}
  .nav{border-left:0;border-bottom:3px solid transparent;font-size:16px;padding:12px}
  .nav.active{border-bottom-color:var(--lav)}
  .collapse-btn{display:none}
  .opts{grid-template-columns:1fr}
  .study{padding:24px 10px}
  .explain{flex-direction:column}.explain ul{padding-left:20px}.explain img{max-width:100%}
  .tab{padding:12px 18px;font-size:18px}
  .logo{font-size:34px}.pill span{display:none}
  .gear{margin-left:8px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO
   ===================================================================== */
const APP_NOME = "Lumi";          // nome que aparece no topo
const APP_INICIAIS = "V";         // letra no avatar

/* =====================================================================
   BANCO DE DADOS
   ---------------------------------------------------------------------
   materias[] -> { id, nome, cor, kits[] }
     kit: { id, tema, titulo, icone, materiais[], perguntas[], flashcards[], guia? }
     - kits com o mesmo "tema" viram uma seção na tela inicial
     - o card "<Tema> – todos" e o card "Geral" são criados automaticamente
     pergunta: { pergunta, opcoes[4], correta 0-3, explicacao[3], fonte, bloco, nivel, complemento }
   Para adicionar um tema novo: cole o JSON dele como mais um item em DB.materias
   (ou junte os kits dentro de "anatopato").
   ===================================================================== */
const DB = { materias: [
{
 "id": "anatopato",
 "nome": "Anatomía Patológica",
 "kits": [
  {
   "id": "neoplasia-1",
   "tema": "Neoplasia",
   "titulo": "Neoplasia 1 – Generalidades de las neoplasias",
   "icone": "hospital",
   "materiais": [
    {
     "nome": "NEOPLASIAS_GENERALIDADES__1.pdf",
     "tipo": "ppt"
    }
   ],
   "perguntas": [
    {
     "pergunta": "Según la definición de Willis, ¿qué rasgo caracteriza el crecimiento de una neoplasia?",
     "opcoes": [
      "Se detiene cuando desaparece el estímulo que lo desencadenó",
      "Avanza coordinado con el de los tejidos normales vecinos",
      "Mantiene su carácter excesivo una vez cesado el estímulo",
      "Responde de forma proporcional a una demanda funcional"
     ],
     "correta": 2,
     "explicacao": [
      "Willis define la neoplasia como una masa de crecimiento excesivo que persiste una vez concluido el estímulo que provocó el cambio.",
      "El crecimiento sobrepasa al de los tejidos normales y no está coordinado con ellos, lo que refleja su autonomía.",
      "Detenerse al cesar el estímulo es justamente lo opuesto: indica un proceso dependiente del estímulo, no neoplásico."
     ],
     "fonte": "NEOPLASIAS_GENERALIDADES__1.pdf, slide 2",
     "bloco": "Definición y componentes",
     "nivel": "facil",
     "complemento": false
    },
    {
     "pergunta": "¿Qué asociación entre término y raíz griega es correcta?",
     "opcoes": [
      "Cáncer – karkínos (cangrejo)",
      "Oncología – karkínos (cangrejo)",
      "Cáncer – ónkos (masa)",
      "Neoplasia – ónkos (masa)"
     ],
     "correta": 0,
     "explicacao": [
      "Cáncer proviene de karkínos, que significa cangrejo.",
      "Oncología deriva de ónkos (masa) y es la ciencia que estudia los tumores; neoplasia significa «nuevo crecimiento».",
      "El error más frecuente es intercambiar las raíces: ónkos corresponde a oncología, no a cáncer."
     ],
     "fonte": "NEOPLASIAS_GENERALIDADES__1.pdf, slide 3",
     "bloco": "Definición y componentes",
     "nivel": "facil",
     "complemento": false
    },
    {
     "pergunta": "La neoplasia se define como un crecimiento sin propósito de un tejido. ¿Qué tres atributos tiende a presentar ese crecimiento?",
     "opcoes": [
      "Reversible, coordinado y adaptativo",
      "Típico, regulado y expansivo",
      "Atípico, dependiente del estímulo y limitado",
      "Atípico, autónomo y agresivo"
     ],
     "correta": 3,
     "explicacao": [
      "La definición del material describe la neoplasia como un crecimiento sin propósito que tiende a ser atípico, autónomo y agresivo.",
      "La autonomía implica que el crecimiento no depende del estímulo ni de los mecanismos de regulación normales.",
      "La opción «atípico, dependiente del estímulo» es tentadora por el primer término, pero la dependencia del estímulo contradice la autonomía."
     ],
     "fonte": "NEOPLASIAS_GENERALIDADES__1.pdf, slide 3",
     "bloco": "Definición y componentes",
     "nivel": "facil",
     "complemento": false
    },
    {

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

function materias() {
  const imp = store.get(K.imp, { materias: [] });
  const list = JSON.parse(JSON.stringify(DB.materias));
  for (const m of imp.materias || []) {
    const ex = list.find(x => x.id === m.id);
    if (ex) {
      for (const k of m.kits || []) {
        const i = ex.kits.findIndex(x => x.id === k.id);
        i >= 0 ? ex.kits[i] = k : ex.kits.push(k);
      }
    } else list.push(m);
  }
  for (const m of list) {
    for (const k of m.kits) {
      k.materiais ||= []; k.perguntas ||= []; k.flashcards ||= []; k.guia ||= "";
      k.perguntas.forEach((q, i) => q._uid = k.id + "#" + i);
    }
  }
  // cada tema vira uma seção; cria "<Tema> – todos" e "Geral" automaticamente
  const ROTA = ["vermelho", "roxo", "azul", "verde", "laranja"];
  const secoes = [];
  for (const m of list) {
    const temas = [...new Set(m.kits.map(k => k.tema || ""))];
    const comTema = temas.filter(t => t);
    temas.forEach((t, ti) => {
      const kits = m.kits.filter(k => (k.tema || "") === t);
      const id = t ? m.id + "--" + slug(t) : m.id;
      const sec = { id, nome: t || m.nome, cor: t ? ROTA[(ti + ROTA.indexOf(m.cor || "vermelho")) % ROTA.length] : m.cor, kits: [...kits] };
      if (t && kits.length > 1) sec.kits.push(juntar(id + "--todos", `${t} – todos`, kits, "gota"));
      secoes.push(sec);
    });
    if (comTema.length > 1) {
      const all = m.kits.filter(k => k.tema);
      secoes.push({ id: m.id + "--geral", nome: `${m.nome} – Geral`, cor: "roxo", kits: [juntar(m.id + "--geral-todos", "Todos os temas", all, "coracao")] });
    }
  }
  for (const s of secoes) {
    s.cor = PREF.cores[s.id] || s.cor || "roxo";
    s.nome = PREF.nomes[s.id] || s.nome;
    for (const k of s.kits) k.titulo = PREF.nomes["kit:" + k.id] || k.titulo;
  }
  return secoes;
}
function slug(t) { return t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-"); }
function juntar(id, titulo, kits, icone) {
  return {
    id, titulo, icone, virtual: true,
    materiais: kits.flatMap(k => k.materiais),
    perguntas: kits.flatMap(k => k.perguntas),
    flashcards: kits.flatMap(k => k.flashcards),
    guia: kits.filter(k => k.guia.trim()).map(k => `<h2>${esc(k.titulo)}</h2>${k.guia}`).join("")
  };
}
function findKit(id) {
  for (const m of materias()) { const k = m.kits.find(k => k.id === id); if (k) return { m, k }; }
  return null;
}
function prog(kitId) {
  PROG[kitId] ||= { xp: 0, notas: "", fc: {} };
  return PROG[kitId];
}
// estatísticas por questão são globais: responder no "todos" conta também no arquivo de origem
const QS = () => (PROG.__q ||= {});
const VOTOS = () => (PROG.__v ||= {});
function dominio(k) {
  if (!k.perguntas.length) return 0;
  const Q = PROG.__q || {};
  let s = 0;
  k.perguntas.forEach(q => { const st = Q[q._uid]; if (st) s += Math.min(st.streak, 2) / 2; });
  return s / k.perguntas.length;
}
function zerarKit(k) {
  const Q = QS(); k.perguntas.forEach(q => delete Q[q._uid]); delete PROG[k.id]; saveProg();
}
function nivel(xp) { return { n: Math.floor(xp / 100) + 1, pct: xp % 100 }; }

function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function modal(html, onMount) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener("click", e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  onMount && onMount(bg, close);
  return close;
}

/* ---------- Estudo inteligente ---------- */
let S = null; // estado da pergunta atual
let BLOCO = {}; // filtro de bloco por kit
function poolIdx(k) {
  const b = BLOCO[k.id];
  const idx = k.perguntas.map((_, i) => i).filter(i => !b || k.perguntas[i].bloco === b);
  return idx.length ? idx : k.perguntas.map((_, i) => i);
}
function escolherPergunta(k, evitar) {
  const Q = QS(), idx = poolIdx(k), n = idx.length;
  const pesos = idx.map(i => {
    if (n > 1 && i === evitar) return 0;
    const st = Q[k.perguntas[i]._uid];
    if (!st) return 3;
    if (st.streak === 0) return 5;
    if (st.streak === 1) return 2;
    return 0.4;
  });
  let tot = pesos.reduce((a, b) => a + b, 0), r = Math.random() * tot;
  for (let j = 0; j < n; j++) { r -= pesos[j]; if (r <= 0) return idx[j]; }
  return idx[0];
}
function blocoSelect(k) {
  const cont = {};
  k.perguntas.forEach(q => { if (q.bloco) cont[q.bloco] = (cont[q.bloco] || 0) + 1; });
  const bs = Object.keys(cont);
  if (bs.length < 2) return "";
  return `<div class="bloco-filter">${ico("folder")}<select id="bloco">
    <option value="">Todos os blocos (${k.perguntas.length})</option>
    ${bs.map(b => `<option value="${esc(b)}" ${BLOCO[k.id] === b ? "selected" : ""}>${esc(b)} (${cont[b]})</option>`).join("")}
  </select>${ico("chev", "ico chev")}</div>`;
}
function viewEstudo(c, k, keep) {
  if (!k.perguntas.length) {
    c.innerHTML = `<div class="empty" style="font-size:20px;padding:80px">Este kit ainda não tem perguntas.<br><br>Vamos montar juntos o conteúdo e colar no banco de dados 😉</div>`; return;
  }
  const p = prog(k.id);
  if (!keep || !S || S.kit !== k.id) {
    const i = escolherPergunta(k, S && S.kit === k.id ? S.i : -1);
    const ordem = [0, 1, 2, 3].slice(0, k.perguntas[i].opcoes.length);
    if (PREF.embaralhar) ordem.sort(() => Math.random() - .5);
    S = { kit: k.id, i, ordem, resp: null, revel: false, sessao: S && S.kit === k.id ? S.sessao : [] };
  }
  const q = k.perguntas[S.i];
  const lv = nivel(p.xp || 0);
  const d = dominio(k);
  const done = S.resp !== null || S.revel;
  const voto = VOTOS()[q._uid];
  const NIV = { facil: "fácil", medio: "médio", dificil: "difícil" };

  c.innerHTML = `<div class="level">
      <div class="lvl-track"><i style="width:${lv.pct}%"></i><span style="left:calc(${Math.max(lv.pct, 0)}% + 14px)">Nível ${lv.n}: ${lv.pct}%</span></div>
      ${STAR(`fill="${d > 0 ? "#d3a6f0" : "#3a2f6a"}"`)}${STAR(d >= .5 ? 'fill="#1b8fe0"' : 'fill="none" stroke="#1b8fe0" stroke-width="1.5"')}${STAR(d >= 1 ? 'fill="#ffd23f"' : 'fill="#2a2256"')}
      <button class="gear" onclick="config('${k.id}')">${ico("gear")}</button>
    </div>
    <div class="study">
      ${blocoSelect(k)}
      <div class="question">${esc(q.pergunta)}</div>
      <div class="opts">${S.ordem.map((oi, pos) => {
        let cls = "", num = pos + 1;
        if (done && oi === q.correta) { cls = "correct"; num = ico("check"); }
        else if (S.resp === oi) { cls = "wrong"; num = ico("x"); }
        return `<button class="opt ${cls}" data-o="${oi}" ${done ? "disabled" : ""}><span class="num">${num}</span>${esc(q.opcoes[oi])}</button>`;
      }).join("")}</div>
      <div class="study-row">
        ${done ? `<button class="btn-light" id="hist">Histórico de perguntas</button>` : `<button class="btn-light" id="revel">Mostrar resposta</button>`}
        <div class="thumbs"><button class="up ${voto === 1 ? "on" : ""}" data-v="1">${ico("up")}</button><button class="down ${voto === -1 ? "on" : ""}" data-v="-1">${ico("down")}</button></div>
      </div>
      <div class="center"><button class="btn-pill-lav" id="next">${done ? "Próxima pergunta" : "Pular"}</button></div>
      ${done ? `<div class="explain"><div style="flex:1"><ul>${(q.explicacao || []).map(e => `<li>${esc(e)}</li>`).join("")}</ul>
        <div class="meta">${q.fonte ? `<span>📄 ${esc(q.fonte)}</span>` : ""}${q.bloco ? `<span>${esc(q.bloco)}</span>` : ""}${q.nivel ? `<span>${NIV[q.nivel] || esc(q.nivel)}</span>` : ""}${q.complemento ? `<span class="warn">complemento (fora dos slides)</span>` : ""}</div></div>
        ${q.imagem ? `<img src="${esc(q.imagem)}" alt="">` : ""}</div>` : ""}
      <div class="kbd">Atalhos: 1–4 responder · Enter próxima · Espaço mostrar resposta</div>
    </div>`;

  c.querySelectorAll(".opt").forEach(b => b.onclick = () => responder(k, +b.dataset.o));
  const rv = $("#revel"); if (rv) rv.onclick = () => { S.revel = true; S.sessao.unshift({ q: q.pergunta, ok: null }); viewEstudo(c, k, true); };
  const hs = $("#hist"); if (hs) hs.onclick = () => historico();
  $("#next").onclick = () => { S.resp = null; viewEstudo(c, k); };
  const bsel = $("#bloco");
  if (bsel) bsel.onchange = () => { BLOCO[k.id] = bsel.value; S = null; viewEstudo(c, k); };
  c.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    const V = VOTOS(), v = +b.dataset.v; V[q._uid] = V[q._uid] === v ? 0 : v; saveProg(); viewEstudo(c, k, true);
    toast(v === 1 ? "Valeu! Pergunta marcada como boa" : "Pergunta marcada para revisar");
  });
  document.onkeydown = e => {
    if (document.querySelector(".modal-bg") || !location.hash.includes("/estudo")) return;
    if (!done && /^[1-4]$/.test(e.key)) { const oi = S.ordem[+e.key - 1]; if (oi !== undefined) responder(k, oi); }
    else if (e.key === "Enter") $("#next")?.click();
    else if (e.key === " " && !done) { e.preventDefault(); $("#revel")?.click(); }
  };
}
function responder(k, oi) {
  const p = prog(k.id), q = k.perguntas[S.i], ok = oi === q.correta;
  const st = QS()[q._uid] ||= { c: 0, w: 0, streak: 0 };
  if (ok) { st.c++; st.streak++; p.xp = (p.xp || 0) + (st.streak > 1 ? 4 : 6); }
  else { st.w++; st.streak = 0; p.xp = (p.xp || 0) + 1; }
  S.resp = oi; S.sessao.unshift({ q: q.pergunta, ok, certa: q.opcoes[q.correta] });
  saveProg(); viewEstudo($("#content"), k, true);
  if (ok && (p.xp % 100) < 6 && p.xp >= 100) toast(`🎉 Subiu para o nível ${nivel(p.xp).n}!`);
}
function historico() {
  const h = S.sessao;
  modal(`<h3>Histórico de perguntas</h3><div class="hist">${h.length ? h.map(x =>
    `<div><b>${x.ok === null ? "👁" : x.ok ? "✅" : "❌"}</b><span>${esc(x.q)}${x.ok === false ? `<br><small style="color:var(--muted)">Certa: ${esc(x.certa)}</small>` : ""}</span></div>`).join("") : "<p>Nada ainda nesta sessão.</p>"}</div>
    <div class="actions"><button class="btn-pill-lav" data-close>Fechar</button></div>`);
}
function config(id) {
  const { k } = findKit(id); const Q = QS();
  const sts = k.perguntas.map(q => Q[q._uid]).filter(Boolean);
  const ac = sts.reduce((a, s) => a + s.c, 0), er = sts.reduce((a, s) => a + s.w, 0);
  const V = VOTOS(), ruins = k.perguntas.filter(q => V[q._uid] === -1);
  modal(`<h3>Configurações</h3>
    <div class="row"><span>Embaralhar alternativas</span><button class="switch ${PREF.embaralhar ? "on" : ""}" id="sw"></button></div>
    <div class="row"><span>Acertos / erros</span><b>${ac} / ${er}</b></div>
    <div class="row"><span>Domínio do kit</span><b>${Math.round(dominio(k) * 100)}%</b></div>
    <div class="row"><span>Questões marcadas com 👎</span><b>${ruins.length}</b></div>
    ${ruins.length ? `<div class="hist" style="margin:10px 0">${ruins.map(q => `<div><b>👎</b><span>${esc(q.pergunta)}<br><small style="color:var(--muted)">${esc(q.fonte || "")}</small></span></div>`).join("")}</div>` : ""}
    <div class="row"><span>Zerar progresso deste kit</span><button class="btn-light" id="rz" style="font-size:16px;padding:8px 14px">Zerar</button></div>
    <div class="actions"><button class="btn-pill-lav" data-close>Fechar</button></div>`,
    (bg, close) => {
      bg.querySelector("#sw").onclick = e => { PREF.embaralhar = !PREF.embaralhar; savePref(); e.target.classList.toggle("on"); };
      bg.querySelector("#rz").onclick = () => { zerarKit(k); S = null; close(); render(); toast("Progresso zerado"); };
    });
}

/* ---------- Guia ---------- */
function viewGuia(c, k) {
  c.innerHTML = k.guia.trim()
    ? `<div class="guide"><h1 style="font-size:32px;margin-bottom:6px">${esc(k.titulo)}</h1>${k.guia}</div>`
    : `<div class="empty" style="font-size:20px;padding:80px">O guia deste kit ainda está vazio.</div>`;
}

/* ---------- Flashcards ---------- */
let F = { kit: null, i: 0, ordem: [] };
function viewFlash(c, k) {
  if (!k.flashcards.length) { c.innerHTML = `<div class="empty" style="font-size:20px;padding:80px">Ainda não há flashcards neste kit.</div>`; return; }
  if (F.kit !== k.id) F = { kit: k.id, i: 0, ordem: k.flashcards.map((_, i) => i) };
  const p = prog(k.id); const idx = F.ordem[F.i]; const card = k.flashcards[idx];
  const sabidos = Object.values(p.fc).filter(v => v === 1).length;
  c.innerHTML = `<div class="fc-wrap">
    <div class="fc-count">${F.i + 1} / ${F.ordem.length} · sei ${sabidos} de ${k.flashcards.length}</div>
    <div class="fc" id="fc"><div class="fc-inner">
      <div class="fc-face"><small>Pergunta</small>${esc(card.frente)}</div>
      <div class="fc-face fc-back"><small>Resposta</small>${esc(card.verso)}${card.fonte ? `<div style="position:absolute;bottom:16px;font-size:13px;color:var(--muted)">📄 ${esc(card.fonte)}</div>` : ""}</div></div></div>
    <div class="fc-actions">
      <button class="btn-light" id="prev">← Anterior</button>
      <button class="btn-light" id="nao" style="background:#ff8a8a">Não sabia</button>
      <button class="btn-light" id="sim" style="background:#7ee28f">Sabia</button>
      <button class="btn-light" id="prox">Próximo →</button>
      <button class="btn-pill-lav" id="emb">Embaralhar</button>
    </div><div class="kbd">Clique no card (ou Espaço) para virar · ← → para navegar</div></div>`;
  const fc = $("#fc"); fc.onclick = () => fc.classList.toggle("flip");
  const go = d => { F.i = (F.i + d + F.ordem.length) % F.ordem.length; viewFlash(c, k); };
  $("#prev").onclick = () => go(-1); $("#prox").onclick = () => go(1);
  $("#sim").onclick = () => { p.fc[idx] = 1; saveProg(); go(1); };
  $("#nao").onclick = () => { p.fc[idx] = 0; saveProg(); go(1); };
  $("#emb").onclick = () => { F.ordem.sort(() => Math.random() - .5); F.i = 0; viewFlash(c, k); };
  document.onkeydown = e => {
    if (!location.hash.includes("/flashcards") || document.querySelector(".modal-bg")) return;
    if (e.key === " ") { e.preventDefault(); fc.classList.toggle("flip"); }
    if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1);
  };
}

/* ---------- Prova ---------- */
let P = null;
function viewProva(c, k) {
  if (!k.perguntas.length) { c.innerHTML = `<div class="empty" style="font-size:20px;padding:80px">Sem perguntas para montar a prova.</div>`; return; }
  if (!P || P.kit !== k.id) P = { kit: k.id, fase: "setup", n: Math.min(10, k.perguntas.length) };
  const tot = k.perguntas.length;
  if (P.fase === "setup") {
    const ops = [...new Set([10, 20, 40, tot].filter(x => x <= tot))];
    c.innerHTML = `<div class="exam"><div class="exam-setup"><h2>Prova</h2>
      <p>Responda sem ver as explicações. No final você vê a nota e a correção.</p>
      <div class="choices">${ops.map(o => `<button class="chip ${P.n === o ? "on" : ""}" data-n="${o}">${o === tot ? `Todas (${o})` : `${o} perguntas`}</button>`).join("")}</div>
      <button class="btn-lav" id="go">${ico("play")} Começar prova</button></div></div>`;
    c.querySelectorAll(".chip").forEach(b => b.onclick = () => { P.n = +b.dataset.n; viewProva(c, k); });
    $("#go").onclick = () => {
      const idx = k.perguntas.map((_, i) => i).sort(() => Math.random() - .5).slice(0, P.n);
      P = { ...P, fase: "q", idx, at: 0, resp: [], ordens: idx.map(i => k.perguntas[i].opcoes.map((_, j) => j).sort(() => PREF.embaralhar ? Math.random() - .5 : 0)) };
      viewProva(c, k);
    };
  } else if (P.fase === "q") {
    const qi = P.idx[P.at], q = k.perguntas[qi];
    c.innerHTML = `<div class="exam"><div class="exam-progress"><i style="width:${P.at / P.idx.length * 100}%"></i></div>
      <div class="fc-count">Pergunta ${P.at + 1} de ${P.idx.length}</div>
      <div class="question">${esc(q.pergunta)}</div>
      <div class="opts">${P.ordens[P.at].map((oi, pos) => `<button class="opt" data-o="${oi}"><span class="num">${pos + 1}</span>${esc(q.opcoes[oi])}</button>`).join("")}</div></div>`;
    const pick = oi => { P.resp.push(oi); P.at++; if (P.at >= P.idx.length) P.fase = "fim"; viewProva(c, k); };
    c.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.o));
    document.onkeydown = e => { if (location.hash.includes("/prova") && P.fase === "q" && /^[1-4]$/.test(e.key)) { const oi = P.ordens[P.at][+e.key - 1]; if (oi !== undefined) pick(oi); } };
  } else {
    const ac = P.idx.filter((qi, j) => P.resp[j] === k.perguntas[qi].correta).length;
    const nota = Math.round(ac / P.idx.length * 100);
    const p = prog(k.id); p.xp = (p.xp || 0) + ac * 3; saveProg();
    c.innerHTML = `<div class="exam"><div class="score"><div class="big">${nota}%</div><p style="font-size:20px">${ac} de ${P.idx.length} certas ${nota >= 70 ? "🎉" : "💪"}</p>
      <div style="margin-top:20px;display:flex;gap:12px;justify-content:center"><button class="btn-lav" id="again">Nova prova</button><button class="btn-light" onclick="location.hash='#/kit/${k.id}/estudo'">Revisar no estudo inteligente</button></div></div>
      <div class="review">${P.idx.map((qi, j) => { const q = k.perguntas[qi], ok = P.resp[j] === q.correta;
        return `<div class="${ok ? "" : "bad"}"><b>${ok ? "✅" : "❌"} ${esc(q.pergunta)}</b><br>
          ${ok ? "" : `<small>Sua resposta: ${esc(q.opcoes[P.resp[j]])}</small><br>`}<small>Correta: ${esc(q.opcoes[q.correta])}</small>${q.fonte ? `<br><small>📄 ${esc(q.fonte)}</small>` : ""}</div>`; }).join("")}</div></div>`;
    $("#again").onclick = () => { P.fase = "setup"; viewProva(c, k); };
  }
}

/* ---------- importar / exportar ---------- */
function importar() {
  modal(`<h3>Crie um kit de estudo</h3>
    <p>Cole aqui o JSON de uma matéria (com os kits dentro). Se o <b>id</b> da matéria já existir, os kits são adicionados nela. Fica salvo neste navegador.</p>
    <textarea id="js" placeholder='{"id":"farmaco","nome":"Farmacologia","cor":"azul","kits":[{"id":"aines","titulo":"AINEs","icone":"hospital","perguntas":[{"pergunta":"…","opcoes":["a","b","c","d"],"correta":0,"explicacao":["…"]}]}]}'></textarea>
    <div class="actions"><button class="btn-light" id="limpa" style="margin-right:auto;font-size:15px">Apagar importados</button>
      <button class="btn-light" data-close>Cancelar</button><button class="btn-pill-lav" id="ok">Importar</button></div>`,
    (bg, close) => {
      bg.querySelector("#ok").onclick = () => {
        try {
          let d = JSON.parse(bg.querySelector("#js").value);
          const arr = Array.isArray(d) ? d : d.materias || [d];
          if (!arr.every(m => m.id && m.nome && Array.isArray(m.kits))) throw new Error("Cada matéria precisa de id, nome e kits[]");
          const imp = store.get(K.imp, { materias: [] });
          for (const m of arr) {
            const ex = imp.materias.find(x => x.id === m.id);
            if (ex) for (const k of m.kits) { const i = ex.kits.findIndex(x => x.id === k.id); i >= 0 ? ex.kits[i] = k : ex.kits.push(k); }
            else imp.materias.push(m);
          }
          store.set(K.imp, imp); close(); render(); toast("Importado!");
        } catch (e) { toast("JSON inválido: " + e.message); }
      };
      bg.querySelector("#limpa").onclick = () => { store.set(K.imp, { materias: [] }); close(); render(); toast("Importados apagados"); };
    });
}
function exportKit() {
  const id = location.hash.split("/")[2]; const { m, k } = findKit(id);
  const json = JSON.stringify({ id: m.id, nome: m.nome, cor: m.cor, kits: [k] }, null, 2);
  modal(`<h3>Compartilhar kit</h3><p>Copie este JSON e envie para alguém — a pessoa cola em "Crie um kit de estudo".</p>
    <textarea readonly>${esc(json)}</textarea><div class="actions"><button class="btn-light" data-close>Fechar</button><button class="btn-pill-lav" id="cp">Copiar</button></div>`,
    bg => bg.querySelector("#cp").onclick = () => { navigator.clipboard?.writeText(json).then(() => toast("Copiado!"), () => toast("Selecione e copie manualmente")); });
}
function sobre() {
  modal(`<h3>Como usar</h3>
    <p><b>Estudo inteligente:</b> as perguntas que você erra voltam mais vezes; as que acerta duas vezes seguidas contam como dominadas e enchem a barra do card.</p>
    <p><b>Nível:</b> cada acerto dá XP. A cada 100 XP você sobe de nível.</p>
    <p><b>Conteúdo:</b> fica no bloco <code>DB</code> no começo do arquivo, ou pode ser colado em "Crie um kit de estudo".</p>
    <p>Seu progresso fica salvo neste navegador.</p>
    <div class="actions"><button class="btn-pill-lav" data-close>Entendi</button></div>`);
}

/* ---------- roteador ---------- */
function render() {
  document.onkeydown = null;
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  if (parts[0] === "kit" && parts[1]) renderKit(parts[1], parts[2] || "materiais");
  else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { if (!location.hash.includes("/estudo")) S = S; render(); });
render();
</script>
</body>
</html>
